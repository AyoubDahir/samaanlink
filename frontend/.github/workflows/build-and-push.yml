name: build-and-push

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version tag (semver on tag, SHA on main)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            echo "TAG=${REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Set encryption build args (with sane defaults)
        env:
          V_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          V_ENC_ENABLED: ${{ vars.NEXT_PUBLIC_ENCRYPTION_ENABLED }}
          V_DOUBLE: ${{ vars.NEXT_PUBLIC_DOUBLE_ENCRYPTION_ENABLED }}
          V_JWKS_URL: ${{ vars.NEXT_PUBLIC_ENCRYPTION_JWKS_URL }}
          V_BFF_JWK: ${{ vars.NEXT_PUBLIC_BFF_ENCRYPTION_PUBLIC_JWK }}
          V_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          V_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${V_API_BASE:-https://edge.bulshobank.com/api/v1}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_ENCRYPTION_ENABLED=${V_ENC_ENABLED:-true}" >> "$GITHUB_ENV"
          if [ -z "${V_BFF_JWK}" ]; then
            # If no BFF public JWK provided, default to single-hop encryption
            echo "NEXT_PUBLIC_DOUBLE_ENCRYPTION_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_DOUBLE_ENCRYPTION_ENABLED=${V_DOUBLE:-true}" >> "$GITHUB_ENV"
          fi
          echo "NEXT_PUBLIC_ENCRYPTION_JWKS_URL=${V_JWKS_URL:-/api/jwks}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BFF_ENCRYPTION_PUBLIC_JWK=${V_BFF_JWK}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_POSTHOG_KEY=${V_POSTHOG_KEY}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_POSTHOG_HOST=${V_POSTHOG_HOST:-https://us.i.posthog.com}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bulsho-development-bank/bank-connect:${{ env.TAG }}
            ghcr.io/bulsho-development-bank/bank-connect:latest
          cache-from: type=registry,ref=ghcr.io/bulsho-development-bank/bank-connect:buildcache
          cache-to: type=registry,ref=ghcr.io/bulsho-development-bank/bank-connect:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_ENCRYPTION_ENABLED=${{ env.NEXT_PUBLIC_ENCRYPTION_ENABLED }}
            NEXT_PUBLIC_DOUBLE_ENCRYPTION_ENABLED=${{ env.NEXT_PUBLIC_DOUBLE_ENCRYPTION_ENABLED }}
            NEXT_PUBLIC_ENCRYPTION_JWKS_URL=${{ env.NEXT_PUBLIC_ENCRYPTION_JWKS_URL }}
            NEXT_PUBLIC_BFF_ENCRYPTION_PUBLIC_JWK=${{ env.NEXT_PUBLIC_BFF_ENCRYPTION_PUBLIC_JWK }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ env.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }}
