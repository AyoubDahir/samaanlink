#db specific properties
#
# PostgreSQL is the target datastore (see architecture doc: one database, one schema per
# module). Flyway owns the "identity" schema (db/migration/identity) and every further module
# schema as it's built; the still-live legacy FoodyExpress entities keep landing in the default
# "public" schema via ddl-auto=update until Task 6 replaces them. Once every schema is
# Flyway-managed, ddl-auto should drop to validate/none.
spring.datasource.url=jdbc:postgresql://localhost:5432/samaanlink
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
server.port=8088

#ORM s/w specific properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=true

#validation exception activate
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Money is always BigDecimal (see com.samaanlink.common.money.Money) - force plain-string
# serialization so amounts never render in scientific notation over the wire.
spring.jackson.generator.write-bigdecimal-as-plain=true