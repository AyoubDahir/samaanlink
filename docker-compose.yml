services:
  postgres:
    image: postgres:17
    container_name: samaanlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: samaanlink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samaanlink"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./FoodyExpress
    container_name: foodyexpress-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/samaanlink
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ../prime-frontend
      args:
        API_PROXY_TARGET: http://app:8088
    container_name: samaanlink-frontend
    restart: unless-stopped
    depends_on:
      - app
    environment:
      API_PROXY_TARGET: http://app:8088
    ports:
      - "3000:3000"

volumes:
  postgres_data:
